# The tools site: site/ plus the story pack, published to GitHub Pages
# (https://omer-faruq-xteink.github.io/touch-licorice-apps/) on every push to main that touches it.
name: Tools site

on:
  push:
    branches: [main]
    paths: ['site/**', 'apps/gamebook/stories/**', 'tools/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I tools/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
